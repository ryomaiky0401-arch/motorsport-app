name: Connect F1 auto sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert F1 sync into app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          marker = '# AUTO_F1_SYNC_MARKER'
          if marker not in text:
              old = 'data = load_data()\n'
              new = '''data = load_data()\n\n# AUTO_F1_SYNC_MARKER\ntry:\n    from f1_sync import fetch_f1_season, merge_f1_results\n    imported_f1 = fetch_f1_season(2026)\n    added_f1 = merge_f1_results(data, 2026, imported_f1)\n    if added_f1:\n        save_data(data)\n    st.sidebar.caption(f"F1自動取得: {added_f1}件追加")\nexcept Exception as auto_f1_error:\n    st.sidebar.warning(f"F1自動取得をスキップしました: {auto_f1_error}")\n'''
              if old not in text:
                  raise SystemExit('data = load_data() was not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Connect F1 auto sync to app'
          git push
