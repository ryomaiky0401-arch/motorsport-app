name: Fix F1 sync to manual button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace automatic F1 sync block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          start = text.find("# AUTO_F1_SYNC_MARKER")
          end = text.find("tab1, tab2, tab3, tab4 = st.tabs(")

          if start == -1 or end == -1:
              print("Target block was not found. Nothing to change.")
              raise SystemExit(0)

          replacement = '''# MANUAL_F1_SYNC_MARKER
st.sidebar.subheader("🏁 F1データ更新")
st.sidebar.caption("APIへのアクセスはボタンを押したときだけ行います。")

if st.sidebar.button("F1データを取得・更新", use_container_width=True):
    with st.spinner("F1のデータを取得しています。少し待ってね…"):
        try:
            from f1_sync import fetch_f1_season, merge_f1_results
            imported_f1 = fetch_f1_season(2026)
            added_f1 = merge_f1_results(data, 2026, imported_f1)
            if added_f1:
                save_data(data)
            st.sidebar.success(f"F1データ更新完了：{added_f1}件追加")
        except Exception as manual_f1_error:
            st.sidebar.error(f"F1データ取得に失敗しました: {manual_f1_error}")

'''

          new_text = text[:start] + replacement + text[end:]
          if new_text != text:
              path.write_text(new_text, encoding="utf-8")
              print("app.py was patched.")
          else:
              print("No changes needed.")
          PY

      - name: Commit patched app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Use manual button for F1 data updates"
            git push
          fi